name: Prognose aktualisieren

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "data/manual/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prognose
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten holen und Prognose rechnen
        run: python3 src/run.py
      - name: Log sichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "Daten und Prognose-Log aktualisiert"; git pull --rebase; git push; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Eigener Job: deploy-pages fragte direkt nach dem Hochladen nach dem Artefakt
  # und fand es gelegentlich noch nicht ("No artifacts named github-pages").
  # Zwischen zwei Jobs vergehen einige Sekunden; reicht das nicht, folgt ein zweiter Versuch.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Kurz warten vor zweitem Versuch
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
